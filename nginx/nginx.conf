events {
    worker_connections 1024;
}

http {

    upstream round_robin {
        server server1:80 max_fails=1 fail_timeout=30s;
        server server2:80 max_fails=1 fail_timeout=30s;
        server server3:80 max_fails=1 fail_timeout=30s;
    }

    upstream least_connections {
        least_conn;

        server server1:80 max_fails=1 fail_timeout=30s;
        server server2:80 max_fails=1 fail_timeout=30s;
        server server3:80 max_fails=1 fail_timeout=30s;
    }

    server {
        listen 80;

        location = /slowleast {
            proxy_pass http://least_connections/slow.php;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location /rr {
            proxy_pass http://round_robin/;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location /least {
            proxy_pass http://least_connections/;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location / {
            proxy_pass http://round_robin;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}

